---
name: httpd-proxytunnel
version: 1.3.1
slug: httpd-proxytunnel
description: Run HTTP(S) proxytunnel addon as part of home assistant
url: https://github.com/Dennis-Q/hass-addons/tree/main/httpd-proxytunnel
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: tcp://[HOST]:[PORT:443]
map:
  - type: ssl
    read_only: true
options:
  use_own_ssl_cert: false
  certfile: "/ssl/httpd-proxytunnel/fullchain.pem"
  keyfile: "/ssl/httpd-proxytunnel/privkey.pem"
  auth_username: ''
  auth_password: ''
  enable_limit_connect: true
  limit_allowconnect_port: '22'
  limit_connect_host: ''
  allow_http_proxy: false
schema:
  use_own_ssl_cert: bool
  certfile: str
  keyfile: str
  auth_username: match(^[^:\s]*$)
  auth_password: password
  enable_limit_connect: bool
  limit_allowconnect_port: match(^(\d+(-\d+)?(\s+\d+(-\d+)?)*)?$)?
  limit_connect_host: match(^([A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?)?$)?
  allow_http_proxy: bool
ports:
  443/tcp: 443
