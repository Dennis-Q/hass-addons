# Minimal Apache configuration for httpd-proxytunnel. Replaces the stock
# httpd.conf: only the modules the proxy needs are loaded, and only the
# add-on's own files in conf.d are included.

ServerRoot /var/www
ServerName homeassistant.local
PidFile /run/apache2/httpd.pid

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

User apache
Group apache

ErrorLog /proc/self/fd/2
LogLevel warn

# Stock defaults (default.conf, mpm.conf)
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

StartServers 5
MinSpareServers 5
MaxSpareServers 10
MaxRequestWorkers 250
MaxConnectionsPerChild 0

# Nothing is served from disk
<Directory />
    Require all denied
    Options None
    AllowOverride None
</Directory>

<Files ".ht*">
    Require all denied
</Files>

IncludeOptional /etc/apache2/conf.d/*.conf
