# Global settings. The virtual host (certificate, authentication and proxy
# rules) is generated by run.sh into 20-proxy-vhost.conf at every start.

LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# Improve security
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen 443

# Mozilla "intermediate" TLS profile (TLS 1.2 + 1.3, forward secrecy only)
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
SSLCompression off
SSLPassPhraseDialog builtin
SSLSessionCache "shmcb:/run/apache2/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# Proxy modules are loaded by the apache2-proxy package.
